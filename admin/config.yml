local_backend: false
site_url: http://localhost:4003/emmet/

backend:
  name: github
  repo: alainparadis/emmet
  branch: main
  publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "_articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'article' }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Categories", name: "categories", widget: "list", default: [] }
      - { label: "Featured image", name: "featured_image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "markdown", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "photography"
    label: "Photography"
    folder: "_photography"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "photo-post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Alt Text", name: "alt", widget: "string", hint: "Important for accessibility" }
          - { label: "Categories", name: "categories", widget: "list", default: ["Photography"] }
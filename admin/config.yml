# local_backend: true

backend:
  name: github
  repo: alainparadis/emmet        # Your GitHub username and repository name
  branch: main                    # The branch where your content is stored

publish_mode: editorial_workflow  # Allows drafts before publishing

media_folder: assets/uploads       # Where uploaded images/assets are saved in your repository
public_folder: /assets/uploads            # The public URL path for media files

collections:
  - name: articles
    label: Articles                # The CMS label for this content type
    folder: _posts                 # Directory where articles are saved in the repository
    create: true
    slug: "{{slug}}"               # Slug auto-generated from the title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Body, name: body, widget: markdown }

exclude:
  - static